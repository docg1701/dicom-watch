[package]
name = "dicom-watch"
version = "0.3.6"
edition = "2024"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "image", "svg", "x11", "wayland", "thread-pool"] }
notify = "8"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
zip = "2"
regex = "1"
glob = "0.3"
chrono = "0.4"
futures = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
