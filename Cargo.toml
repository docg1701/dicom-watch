[package]
name = "dicom-watch"
version = "0.8.1"
edition = "2024"
build = "build.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "image", "svg", "x11", "wayland", "thread-pool"] }
notify = "8"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
zip = "2"
regex = "1"
glob = "0.3"
chrono = "0.4"
futures = "0.3"
rfd = "0.17.2"
rust-i18n = "4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["playsoundapi"] }

[build-dependencies]
winres = "0.1"
